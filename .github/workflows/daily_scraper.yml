name: Daily Scraper

on:
  workflow_dispatch: # Per provar-lo manualment quan vulguis
  schedule:
    - cron: '0 1 * * *' # S'executa a la 1:00 UTC cada dia

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permís imprescindible per desar data/queue.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Instal·lem el client oficial d'Apify
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install apify-client

      # Executem el scraper passant-li el secret d'Apify
      - name: Run Scraper via Apify
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scraper.py

      # Si hi ha vídeos nous a la cua, fem push dels canvis
      - name: Commit and Push new Queue
        run: |
          git config --global user.name "NBA Scraper Bot"
          git config --global user.email "bot@nba.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily queue from Apify [skip ci]" && git push)
