name: Daily NBA Scraper
on:
  workflow_dispatch: # Permet executar-lo manualment o via Cron-job.org
  schedule:
    - cron: '0 1 * * *' # S'executa automàticament cada dia a la 01:00 UTC

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important per poder fer el push dels canvis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp requests

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and Push Queue
        run: |
          git config --global user.name "NBA Scraper Bot"
          git config --global user.email "bot@nba.com"
          git add data/queue.json
          # Només fem commit si hi ha canvis (vídeos nous)
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily queue [skip ci]" && git push)
