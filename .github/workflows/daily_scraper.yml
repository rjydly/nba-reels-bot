name: Daily Scraper
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install yt-dlp and JS Runtime
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          sudo apt-get update && sudo apt-get install -y nodejs

      - name: Install Python deps
        run: pip install yt-dlp requests

      - name: Run Scraper
        run: python scraper.py

      - name: Commit changes
        run: |
          git config --global user.name "NBA Bot"
          git config --global user.email "bot@nba.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update queue" && git push)
