name: Hourly Publisher

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 * * * *'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Motor JS oficial per a yt-dlp
      - name: Setup Deno (JS Challenge Solver)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Instal·lació de yt-dlp amb el paquet complet [default]
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -U "yt-dlp[default]" moviepy requests

      - name: Process Video
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: python publisher.py

      - name: Commit and Push Video & State
        id: push_step
        run: |
          git config --global user.name "NBA Publisher Bot"
          git config --global user.email "bot@nba.com"
          git add reels/ data/

          if git diff --staged --quiet; then
            echo "No hi ha canvis per pujar."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            git commit -m "Upload new reel and update state [skip ci]"
            git push
            echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish Reel via Zernio API
        if: steps.push_step.outputs.skip != 'true'
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          GITHUB_SHA: ${{ steps.push_step.outputs.sha }}
        run: python publisher.py --publish
