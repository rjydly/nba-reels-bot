name: Hourly Publisher
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 * * * *'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg and Node
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg nodejs
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Install Python deps
        run: pip install yt-dlp moviepy requests

      - name: Process Video
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: python publisher.py

      - name: Push Video to GitHub
        id: push_step
        run: |
          git config --global user.name "NBA Bot"
          git config --global user.email "bot@nba.com"
          git add reels/ data/
          git commit -m "New Reel ready"
          git push
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Publish to Zernio
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          GITHUB_SHA: ${{ steps.push_step.outputs.sha }}
        run: python publisher.py --publish
