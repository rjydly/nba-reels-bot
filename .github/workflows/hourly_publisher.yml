name: Hourly Publisher
on:
  workflow_dispatch: # O cron cada hora

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install yt-dlp moviepy requests

      - name: Process Video
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: python publisher.py

      - name: Commit and Push Video
        id: commit_step
        run: |
          git config --global user.name "NBA Bot"
          git config --global user.email "bot@nba.com"
          git add reels/ data/
          git commit -m "Publishing new reel"
          git push
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Trigger Zernio
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          GITHUB_SHA: ${{ steps.commit_step.outputs.sha }} # Usem el nou SHA
        run: python publisher.py --publish
